<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Machine learning notebook learning path</title>
  <desc id="desc">A five-step path from data preparation to model comparison.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient>
    <linearGradient id="card" x1="0" x2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/></marker>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <text x="60" y="72" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">A practical machine-learning path</text>
  <text x="60" y="108" fill="#bae6fd" font-family="Arial, sans-serif" font-size="18">Follow the notebooks from raw data to evaluated models.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(55 175)"><rect width="190" height="220" rx="18" fill="url(#card)"/><circle cx="38" cy="42" r="23" fill="#0284c7"/><text x="38" y="50" text-anchor="middle" fill="white" font-size="20" font-weight="700">1</text><text x="25" y="92" fill="#0f172a" font-size="20" font-weight="700">Prepare</text><text x="25" y="124" fill="#334155" font-size="15">Missing values</text><text x="25" y="148" fill="#334155" font-size="15">Encoding</text><text x="25" y="172" fill="#334155" font-size="15">Scaling</text></g>
    <path d="M255 285 H285" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(295 175)"><rect width="190" height="220" rx="18" fill="url(#card)"/><circle cx="38" cy="42" r="23" fill="#0284c7"/><text x="38" y="50" text-anchor="middle" fill="white" font-size="20" font-weight="700">2</text><text x="25" y="92" fill="#0f172a" font-size="20" font-weight="700">Explore</text><text x="25" y="124" fill="#334155" font-size="15">Distributions</text><text x="25" y="148" fill="#334155" font-size="15">Correlations</text><text x="25" y="172" fill="#334155" font-size="15">Visual patterns</text></g>
    <path d="M495 285 H525" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(535 175)"><rect width="190" height="220" rx="18" fill="url(#card)"/><circle cx="38" cy="42" r="23" fill="#0284c7"/><text x="38" y="50" text-anchor="middle" fill="white" font-size="20" font-weight="700">3</text><text x="25" y="92" fill="#0f172a" font-size="20" font-weight="700">Build</text><text x="25" y="124" fill="#334155" font-size="15">Linear models</text><text x="25" y="148" fill="#334155" font-size="15">Gradient descent</text><text x="25" y="172" fill="#334155" font-size="15">Classification</text></g>
    <path d="M735 285 H765" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(775 175)"><rect width="190" height="220" rx="18" fill="url(#card)"/><circle cx="38" cy="42" r="23" fill="#0284c7"/><text x="38" y="50" text-anchor="middle" fill="white" font-size="20" font-weight="700">4</text><text x="25" y="92" fill="#0f172a" font-size="20" font-weight="700">Evaluate</text><text x="25" y="124" fill="#334155" font-size="15">MSE and R²</text><text x="25" y="148" fill="#334155" font-size="15">Confusion matrix</text><text x="25" y="172" fill="#334155" font-size="15">Convergence</text></g>
    <path d="M975 285 H1005" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(1015 175)"><rect width="130" height="220" rx="18" fill="#fef3c7"/><circle cx="38" cy="42" r="23" fill="#d97706"/><text x="38" y="50" text-anchor="middle" fill="white" font-size="20" font-weight="700">5</text><text x="20" y="92" fill="#78350f" font-size="19" font-weight="700">Compare</text><text x="20" y="124" fill="#92400e" font-size="14">From scratch</text><text x="20" y="148" fill="#92400e" font-size="14">vs.</text><text x="20" y="172" fill="#92400e" font-size="14">scikit-learn</text></g>
  </g>
  <text x="60" y="485" fill="#bae6fd" font-family="Arial, sans-serif" font-size="16">Core idea: understand the mathematics, implement it, visualise it, then validate it.</text>
</svg>
